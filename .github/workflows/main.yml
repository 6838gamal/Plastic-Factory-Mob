name: plastic Build Lightweight Flutter APK

on:
 workflow_dispatch:

jobs:
 build:
  runs-on: ubuntu-latest
  
  steps:
  # تحميل المشروع
  - name: Checkout repository
    uses: actions/checkout@v4

  # إعداد Java
  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  # إعداد Android SDK
  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK 36
    run: |
      sdkmanager "platforms;android-36"
      sdkmanager "build-tools;36.0.0"

  # إعداد Flutter
  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  # تنظيف المشروع
  - name: Flutter Clean
    run: flutter clean

  # تثبيت الحزم
  - name: Install Dependencies
    run: flutter pub get

  # بناء APK خفيف ARM64 فقط
  - name: Build Lightweight APK
    run: |
      flutter build apk \
        --release \
        --target-platform=android-arm64 \
        --tree-shake-icons \
        --obfuscate \
        --split-debug-info=build/debug-info

  # رفع APK
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: lightweight-release-apk
      path: build/app/outputs/flutter-apk/*.apk

  # رفع ملفات الرموز
  - name: Upload Debug Symbols
    uses: actions/upload-artifact@v4
    with:
      name: debug-symbols
      path: build/debug-info

