[build]
  base = "."
  command = "flutter build web --release --dart-define=API_BASE_URL=https://plastic-factory-api-backend.onrender.com"
  publish = "build/web"

[[redirects]]
from = "/api/*"
to = "https://plastic-factory-api-backend.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
